<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#ffffff;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* CARD */
.container{
    display:flex;
    width:1120px;
    height:580px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.10);
    border:2px solid #e5e7eb;
}

/* LEFT */
.left{
    flex:1;
    background:#ffffff;
    padding:90px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
}

h2{
    font-size:42px;
    margin:0;
    color:#0f172a;
    font-weight:700;
    letter-spacing:-0.8px;
}

p{
    margin-top:10px;
    margin-bottom:35px;
    color:#64748b;
    font-size:16px;
    font-weight:500;
}

/* INPUTS */
input{
    width:100%;
    padding:18px;
    margin-top:16px;
    border-radius:12px;
    border:2px solid #e5e7eb;
    font-size:16px;
    font-weight:500;
    transition:0.2s ease;
}

input:focus{
    outline:none;
    border-color:#1e40af;
    box-shadow:0 0 0 4px rgba(30,64,175,0.10);
}

/* BUTTON */
button{
    width:100%;
    display:block;

    padding:18px;
    margin-top:22px;

    border:none;
    border-radius:12px;

    font-size:16px;
    font-weight:700;
    letter-spacing:0.5px;

    font-family:'Inter',sans-serif;

    color:white;
    cursor:pointer;

    background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);

    box-shadow:0 14px 28px rgba(37,99,235,0.25);
    transition:0.25s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 40px rgba(37,99,235,0.35);
}

/* RIGHT PANEL */
.right{
    flex:1;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:90px;
    color:white;
    position:relative;
}

.right h3{
    font-size:34px;
    margin-bottom:15px;
    font-weight:700;
    color:white;
}

.right p{
    font-size:16px;
    line-height:1.7;
    font-weight:500;
    color:rgba(255,255,255,0.88);
}

/* TOP LABELS */
.top-left{
    position:absolute;
    top:25px;
    left:30px;
    font-size:12px;
    color:#94a3b8;
    font-weight:500;
}

.top-right{
    position:absolute;
    top:25px;
    right:30px;
    font-size:12px;
    color:rgba(255,255,255,0.7);
    font-weight:500;
}

/* FOOTER */
.footer{
    margin-top:25px;
    display:flex;
    gap:28px;
    font-size:13px;
    color:#64748b;
    font-weight:500;
}

.footer span{
    cursor:pointer;
    transition:0.2s;
}

.footer span:hover{
    color:#1e40af;
}

/* INFO TEXT */
.info{
    margin-top:8px;
    font-size:12px;
    color:#94a3b8;
}


















*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#f8fbff,#eef4ff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    position:relative;
    overflow-x:hidden;
}

/* Background Effect */

body::before{
    content:'';
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(37,99,235,.08);
    top:-200px;
    right:-150px;
}

body::after{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    border-radius:50%;
    background:rgba(59,130,246,.05);
    bottom:-150px;
    left:-150px;
}

/* Container */

.container{
    width:100%;
    max-width:1100px;
    background:white;
    border-radius:28px;
    overflow:hidden;
    display:flex;
    box-shadow:
    0 25px 60px rgba(15,23,42,.08);
    position:relative;
    z-index:2;
}

/* Left */

.left{
    flex:1;
    padding:70px 60px;
}

.top-left{
    color:#2563eb;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.left h2{
    font-size:42px;
    color:#0f172a;
    margin-bottom:10px;
}

.left p{
    color:#64748b;
    margin-bottom:35px;
    line-height:1.7;
}

/* Form */

form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

input{
    width:100%;
    padding:17px 18px;
    border:1px solid #dbeafe;
    border-radius:14px;
    font-size:15px;
    transition:.3s;
    background:#f8fbff;
}

input:focus{
    outline:none;
    border-color:#2563eb;
    background:white;
    box-shadow:0 0 0 4px rgba(37,99,235,.1);
}

button{
    height:55px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    background:#1d4ed8;
}

/* Forgot */

form a{
    transition:.3s;
}

form a:hover{
    color:#1d4ed8 !important;
}

/* Right Side */

.right{
    flex:1;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    padding:70px 60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
}

.right::before{
    content:'';
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    top:-70px;
    right:-70px;
}

.right::after{
    content:'';
    position:absolute;
    width:160px;
    height:160px;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    bottom:-50px;
    left:-50px;
}

.top-right{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:2px;
    opacity:.8;
    margin-bottom:20px;
}

.right h3{
    font-size:48px;
    margin-bottom:20px;
    line-height:1.1;
}

.right p{
    font-size:18px;
    line-height:1.9;
    opacity:.95;
}

/* Footer */

.info{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#64748b;
    font-size:14px;
}

/* Mobile */

@media(max-width:900px){

    body{
        padding:15px;
    }

    .container{
        flex-direction:column;
    }

    .right{
        display:none;
    }

    .left{
        padding:40px 25px;
    }

    .left h2{
        font-size:32px;
    }

    .info{
        position:relative;
        margin-top:20px;
        left:auto;
        bottom:auto;
        transform:none;
        text-align:center;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">

        <div class="top-left">Secure Platform • v1.0</div>

        <h2>Connexion</h2>
        <p>Accédez à votre espace professionnel sécurisé</p>

        <form method="post" autocomplete="off">
            <input name="username" placeholder="Nom d'utilisateur ou email" required>
            <input name="password" type="password" placeholder="Mot de passe" required>
            <button>Se connecter</button>

            <!-- ✅ FIXED ROUTE -->
            <!-- LINKS -->
<div style="display:flex;justify-content:space-between;margin-top:15px;">

    <a href="/forgot" style="color:#1e40af;font-size:14px;text-decoration:none;font-weight:500;">
        Mot de passe oublié ?
    </a>

</div>
        </form>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="top-right">Enterprise System</div>

        <h3>CLINIC360 PRO</h3>

        <p>
          Plus de technologie, moins de temps, plus d’organisation, plus de rentabilité et une meilleure réputation.
        </p>

    </div>

</div>

<!-- FOOTER -->


<div class="info">
    © 2026 - Plateforme sécurisée professionnelle
</div>

</body>
</html>
