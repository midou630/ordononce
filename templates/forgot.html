<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mot de passe oublié</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#ffffff;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CARD */
.container{
    display:flex;
    width:1120px;
    height:580px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.10);
    border:2px solid #e5e7eb;
}

/* LEFT */
.left{
    flex:1;
    background:#ffffff;
    padding:90px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

h2{
    font-size:40px;
    margin:0;
    color:#0f172a;
    font-weight:700;
}

p{
    margin-top:10px;
    margin-bottom:30px;
    color:#64748b;
}

/* INPUT */
input{
    width:100%;
    padding:18px;
    margin-top:16px;
    border-radius:12px;
    border:2px solid #e5e7eb;
    font-size:16px;
    font-weight:500;
}

input:focus{
    outline:none;
    border-color:#1e40af;
    box-shadow:0 0 0 4px rgba(30,64,175,0.10);
}

/* BUTTON */
button{
    width:100%;
    padding:18px;
    margin-top:22px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);
    box-shadow:0 14px 28px rgba(37,99,235,0.25);
    transition:0.25s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 40px rgba(37,99,235,0.35);
}

/* RIGHT */
.right{
    flex:1;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:90px;
    color:white;
}





*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding:20px;
}

.container{
    width:100%;
    max-width:1050px;
    min-height:550px;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    display:flex;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* LEFT */

.left{
    flex:1;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h2{
    font-size:38px;
    color:#0f172a;
    margin-bottom:10px;
    font-weight:700;
}

.left p{
    color:#64748b;
    margin-bottom:35px;
    font-size:15px;
    line-height:1.6;
}

.left form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.left input{
    width:100%;
    padding:15px 18px;
    border:1px solid #dbe3ee;
    border-radius:12px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.left input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

.left button{
    border:none;
    cursor:pointer;
    padding:15px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    color:white;
    background:#2563eb;
    transition:.3s;
}

.left button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

/* RIGHT */

.right{
    flex:1;
    background:linear-gradient(
        135deg,
        #2563eb,
        #1e40af
    );
    color:white;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.right::before{
    content:'';
    position:absolute;
    width:320px;
    height:320px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    top:-80px;
    right:-80px;
}

.right::after{
    content:'';
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    bottom:-70px;
    left:-70px;
}

.right h3{
    font-size:34px;
    margin-bottom:20px;
    position:relative;
    z-index:2;
}

.right p{
    font-size:16px;
    line-height:1.9;
    opacity:.95;
    position:relative;
    z-index:2;
}

/* MOBILE */

@media(max-width:900px){

    .container{
        flex-direction:column;
        max-width:500px;
    }

    .right{
        order:-1;
        min-height:260px;
        text-align:center;
        padding:40px;
    }

    .left{
        padding:35px;
    }

    .left h2{
        font-size:30px;
    }

    .right h3{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="left">

        <h2>Mot de passe oublié</h2>
        <p>Entrez votre email pour recevoir un code</p>

        <form method="post">
            <input name="email" placeholder="Votre email" required>
            <button>Envoyer le code</button>
        </form>

    </div>

    <div class="right">
        <h3>Sécurité avancée</h3>
        <p>
            Un code sécurisé sera envoyé à votre email pour réinitialiser votre mot de passe.
        </p>
    </div>

</div>

</body>
</html>
