<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Changer mot de passe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#ffffff;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CARD */
.container{
    display:flex;
    width:1120px;
    height:580px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.10);
    border:2px solid #e5e7eb;
}

/* LEFT */
.left{
    flex:1;
    background:#ffffff;
    padding:90px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

h2{
    font-size:40px;
    margin:0;
    color:#0f172a;
    font-weight:700;
    letter-spacing:-0.8px;
}

p{
    margin-top:10px;
    margin-bottom:30px;
    color:#64748b;
    font-size:15px;
}

/* INPUT */
input{
    width:100%;
    padding:18px;
    margin-top:16px;
    border-radius:12px;
    border:2px solid #e5e7eb;
    font-size:16px;
    font-weight:500;
    transition:0.2s ease;
}

input:focus{
    outline:none;
    border-color:#1e40af;
    box-shadow:0 0 0 4px rgba(30,64,175,0.10);
}

/* BUTTON */
button{
    width:100%;
    padding:18px;
    margin-top:22px;

    border:none;
    border-radius:12px;

    font-size:16px;
    font-weight:700;

    color:white;
    cursor:pointer;

    background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);

    box-shadow:0 14px 28px rgba(37,99,235,0.25);
    transition:0.25s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 40px rgba(37,99,235,0.35);
}

/* RIGHT */
.right{
    flex:1;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:90px;
    color:white;
}

.right h3{
    font-size:34px;
    font-weight:700;
}

.right p{
    font-size:16px;
    color:rgba(255,255,255,0.85);
    line-height:1.6;
}






@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:1100px;
min-height:650px;
background:#fff;
border-radius:30px;
overflow:hidden;
display:flex;
box-shadow:
0 25px 60px rgba(0,0,0,.08);
}

/* LEFT */

.left{
flex:1;
padding:70px;
display:flex;
flex-direction:column;
justify-content:center;
background:white;
}

.left::before{
content:"";
width:70px;
height:6px;
background:#2563eb;
border-radius:20px;
margin-bottom:30px;
display:block;
}

.left h2{
font-size:42px;
font-weight:800;
color:#111827;
margin-bottom:10px;
}

.left p{
font-size:16px;
color:#6b7280;
margin-bottom:40px;
line-height:1.7;
}

form{
display:flex;
flex-direction:column;
gap:18px;
}

input{
height:58px;
border:1px solid #dbe3ef;
border-radius:14px;
padding:0 18px;
font-size:15px;
background:#f8fafc;
transition:.3s;
}

input:focus{
outline:none;
border-color:#2563eb;
background:white;
box-shadow:0 0 0 4px rgba(37,99,235,.12);
}

button{
height:58px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
background:#1d4ed8;
}

.left a{
color:#2563eb;
font-weight:600;
text-decoration:none;
transition:.3s;
}

.left a:hover{
opacity:.8;
}

/* RIGHT */

.right{
flex:1;
background:linear-gradient(
135deg,
#0f172a,
#1e3a8a,
#2563eb
);
color:white;
padding:70px;
display:flex;
flex-direction:column;
justify-content:center;
position:relative;
overflow:hidden;
}

.right::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:rgba(255,255,255,.06);
border-radius:50%;
top:-180px;
right:-120px;
}

.right::after{
content:"";
position:absolute;
width:300px;
height:300px;
background:rgba(255,255,255,.05);
border-radius:50%;
bottom:-120px;
left:-80px;
}

.right h3{
font-size:38px;
font-weight:800;
margin-bottom:25px;
position:relative;
z-index:2;
}

.right p{
font-size:18px;
line-height:1.9;
color:rgba(255,255,255,.92);
position:relative;
z-index:2;
max-width:500px;
}

/* Security card */

.right p::before{
content:"🔐";
display:block;
font-size:60px;
margin-bottom:25px;
}

/* MOBILE */

@media(max-width:900px){

.container{
flex-direction:column;
min-height:auto;
}

.right{
order:-1;
padding:50px 35px;
text-align:center;
}

.right h3{
font-size:30px;
}

.right p{
font-size:16px;
margin:auto;
}

.left{
padding:45px 30px;
}

.left h2{
font-size:32px;
}

}




</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">

        <h2>Changer mot de passe</h2>
        <p>Mettez à jour votre mot de passe en toute sécurité</p>

        <form method="post">

            <!-- 🔥 إضافة فقط (بدون تغيير التصميم) -->
            <input name="old_pass" type="password" placeholder="Ancien mot de passe" required>

            <input name="new_pass" type="password" placeholder="Nouveau mot de passe" required>

            <button>Envoyer code</button>
             <a href="/forgot" style="display:block;margin-top:15px;color:#1e40af;font-size:14px;text-decoration:none;font-weight:500;">
               Mot de passe oublié ?
            </a>
        </form>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <h3>Sécurité avancée</h3>

        <p>
            Votre mot de passe est protégé par un système de vérification sécurisé
            conforme aux standards professionnels modernes.
        </p>

    </div>

</div>

</body>
</html>
