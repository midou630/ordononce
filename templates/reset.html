<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réinitialiser mot de passe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:#ffffff;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* CARD */
.container{
    display:flex;
    width:1120px;
    height:580px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.10);
    border:2px solid #e5e7eb;
}

/* LEFT */
.left{
    flex:1;
    background:#ffffff;
    padding:90px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

h2{
    font-size:40px;
    margin:0;
    color:#0f172a;
    font-weight:700;
}

p{
    margin-top:10px;
    margin-bottom:30px;
    color:#64748b;
}

/* INPUT */
input{
    width:100%;
    padding:18px;
    margin-top:16px;
    border-radius:12px;
    border:2px solid #e5e7eb;
    font-size:16px;
    font-weight:500;
}

input:focus{
    outline:none;
    border-color:#1e40af;
    box-shadow:0 0 0 4px rgba(30,64,175,0.10);
}

/* BUTTON */
button{
    width:100%;
    padding:18px;
    margin-top:22px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#1e40af,#2563eb,#3b82f6);
    box-shadow:0 14px 28px rgba(37,99,235,0.25);
    transition:0.25s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 40px rgba(37,99,235,0.35);
}

/* RIGHT */
.right{
    flex:1;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:90px;
    color:white;
}


/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    background:
    linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
}

/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:1100px;
    min-height:600px;
    display:flex;
    overflow:hidden;
    border-radius:28px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(25px);
    box-shadow:
    0 25px 60px rgba(0,0,0,.25);
}

/* =========================
   LEFT SIDE
========================= */

.left{
    flex:1;
    background:#ffffff;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h2{
    font-size:38px;
    color:#0f172a;
    margin-bottom:12px;
}

.left p{
    color:#64748b;
    margin-bottom:35px;
    line-height:1.6;
}

/* =========================
   FORM
========================= */

form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

input{
    width:100%;
    padding:16px 18px;
    border:1px solid #dbe4f0;
    border-radius:14px;
    font-size:15px;
    transition:.3s;
    outline:none;
}

input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

button{
    border:none;
    cursor:pointer;
    padding:16px;
    border-radius:14px;
    font-size:15px;
    font-weight:600;
    color:white;
    background:linear-gradient(
    135deg,
    #2563eb,
    #1d4ed8
    );
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.25);
}

/* =========================
   RIGHT SIDE
========================= */

.right{
    flex:1;
    padding:60px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.right::before{
    content:"🔐";
    position:absolute;
    top:40px;
    right:40px;
    font-size:100px;
    opacity:.08;
}

.right h3{
    font-size:42px;
    margin-bottom:20px;
}

.right p{
    font-size:18px;
    line-height:1.9;
    opacity:.95;
    max-width:420px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .container{
        flex-direction:column;
    }

    .right{
        order:-1;
        padding:45px 30px;
        text-align:center;
    }

    .right p{
        margin:auto;
    }

    .left{
        padding:40px 25px;
    }

    .left h2{
        font-size:30px;
    }

    .right h3{
        font-size:30px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="left">

        <h2>Réinitialisation</h2>
        <p>Entrez le code et votre nouveau mot de passe</p>

        <form method="post">
            <input name="code" placeholder="Code reçu par email" required>
            <input name="new_pass" type="password" placeholder="Nouveau mot de passe" required>
            <button>Changer mot de passe</button>
        </form>

    </div>

    <div class="right">
        <h3>Vérification sécurisée</h3>
        <p>
            Votre identité est vérifiée avant toute modification pour garantir la sécurité du compte.
        </p>
    </div>

</div>

</body>
</html>
